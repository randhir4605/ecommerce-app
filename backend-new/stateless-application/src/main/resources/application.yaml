server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  web:
    error:
      include-message: always				

app:
  jwt:
    enabled: true
    secret-base64: OKQj46AcIaQ0849RdtFkClwuKgxphvHHq5pEZVZkfnQ=
    issuer: c-store
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    login-endpoint-enabled: true
    login-path: /api/auth/login
    refresh-path: /api/auth/refresh
    logout-path: /api/auth/logout
    public-paths:
      - /api/public/**
