<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px #00000012;
        }

        h1 { color: #102746; }
        p { color: #64748b; }
        .status { color: #16a34a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Authorization Server</h1>
        <p>Welcome! You have successfully logged in.</p>
        <p class="status">● Authentication successful</p>
        <p>Spring Authorization Server is running.</p>
    </div>
</body>
</html>
