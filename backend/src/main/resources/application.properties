spring.application.name=backend

spring.datasource.url=jdbc:postgresql://ep-floral-lake-b3dcrr1o-pooler.c-4.ap-southeast-1.aws.neon.tech/ecommerce_db?sslmode=require
spring.datasource.username=ecommerce_db_owner
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.application.name=backend

# Google OAuth — add your values through environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Google OAuth callback
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BACKEND_URL}/login/oauth2/code/google
# Frontend URL after successful login
app.frontend-url=${FRONTEND_URL}